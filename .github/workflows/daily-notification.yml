name: Daily Practice Reminder

on:
  schedule:
    # 毎日20:00 (JST = UTC+9) に実行 → UTC 11:00
    - cron: '0 11 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Send Push Notification
        run: |
          # 本番環境のPush通知エンドポイントを叩く
          # 通知: この実装はデモ用です。本番ではDBからSubscriptionを取得する必要があります。
          curl -X POST ${{ secrets.APP_URL }}/api/push/send \
            -H "Content-Type: application/json" \
            -d '{
              "subscription": {
                "endpoint": "user-subscription-endpoint",
                "keys": {
                  "p256dh": "user-p256dh-key",
                  "auth": "user-auth-key"
                }
              },
              "data": {
                "title": "Talking - 練習の時間です！",
                "body": "5分間の会話練習で、今日もスキルアップしましょう。",
                "url": "/roleplay"
              }
            }'
